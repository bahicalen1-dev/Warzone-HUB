<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101719"><link rel="manifest" href="manifest.webmanifest"><title>Warzone HUB</title><style>
:root{font-family:system-ui,-apple-system,Arial;background:#0d1315;color:#eef4f0;--green:#91d32c;--panel:#192225;--muted:#94a19f}*{box-sizing:border-box}body{margin:0;padding-bottom:85px}header{position:sticky;top:0;background:#101719ed;backdrop-filter:blur(12px);padding:17px 18px;border-bottom:1px solid #2a3738;z-index:3;display:flex;justify-content:space-between;align-items:center}h1{font-size:21px;margin:0;font-weight:900}h2{font-size:19px;margin:22px 0 12px}small,.muted{color:var(--muted)}.pill{background:#26381b;color:var(--green);padding:9px 15px;border-radius:22px;font-weight:800}.wrap{padding:15px;max-width:850px;margin:auto}.hero{background:linear-gradient(130deg,#283c22,#172224 65%);border:1px solid #38522b;border-radius:20px;padding:22px;margin-bottom:18px}.hero strong{font-size:28px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{background:linear-gradient(140deg,#1e292b,#131b1e);border:1px solid #344143;border-radius:19px;min-height:116px;padding:15px 6px;color:white;text-align:center;cursor:pointer}.tile .ico{display:block;font-size:32px;color:var(--green);margin-bottom:10px}.tile span:last-child{font-size:12px;font-weight:700}.card{background:var(--panel);border:1px solid #334042;border-radius:16px;padding:15px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.stat{font-size:25px;font-weight:900;color:var(--green)}button,input,select,textarea{font:inherit}button{cursor:pointer}.btn{background:var(--green);border:0;border-radius:11px;padding:11px 14px;font-weight:800;color:#13200a}.btn.secondary{background:#2d3c3e;color:#e7eee9}.form{display:grid;gap:10px}.form input,.form select,.form textarea{width:100%;padding:12px;background:#0f1719;color:white;border:1px solid #3d4c4d;border-radius:10px}.form label{font-size:13px;color:#c5d0cb}.progress{height:9px;background:#344044;border-radius:10px;overflow:hidden;margin:9px 0}.progress div{height:100%;background:var(--green)}nav{position:fixed;bottom:0;left:0;right:0;background:#121b1df5;display:flex;border-top:1px solid #334143;z-index:4;padding-bottom:env(safe-area-inset-bottom)}nav button{flex:1;background:none;color:#b2bfba;border:0;padding:12px 2px;font-size:11px}nav button b{display:block;font-size:21px;color:var(--green)}.hidden{display:none}.tag{color:var(--green);font-size:12px}.delete{background:none;border:0;color:#ff9b9b}.hint{font-size:12px;color:#a9b8b3;line-height:1.6}a{color:var(--green)}@media(min-width:650px){.grid{grid-template-columns:repeat(5,1fr)}}

/* Warzone HUB v2 enhancements */
:root{--green:#a3e635;--panel:#192225} .wrap{max-width:900px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))} .tile{min-height:100px}.tile .ico{font-size:26px}.tile span:last-child{font-size:13px} .card{overflow-wrap:anywhere}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{font-size:12px;color:var(--muted)}.badge{display:inline-block;background:#2c3d28;border-radius:20px;padding:5px 9px;font-size:11px;color:var(--green)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions button{flex:1}.sectionTitle{display:flex;justify-content:space-between;align-items:center;gap:10px}.form textarea{min-height:70px}.warning{border-left:3px solid #e9bb59;padding:10px 12px;background:#2b2a20;border-radius:8px}.ok{border-left:3px solid var(--green);padding:10px 12px;background:#22301e;border-radius:8px}nav button{font-size:10px}nav button b{font-size:19px}@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style></head><body><header><h1>WARZONE <span style="color:var(--green)">HUB</span></h1><span class="pill">MY TRACKER</span></header><main class="wrap"><section id="home"><div class="hero"><small>PERSONLIG PS5 TRACKER</small><div><strong>Mission Control</strong></div><p class="muted">Dine stats, våben og missioner samlet ét sted.</p><div class="row"><span>Player Level</span><b id="heroLevel">1</b></div></div><div class="row"><h2>TRACKER</h2><span class="pill">4</span></div><div class="grid" id="tiles"></div><h2>Hurtigt overblik</h2><div class="grid" id="quick"></div><div class="card"><b>🔒 Synkronisering</b><p class="hint">Ingen direkte Activision/PSN-synkronisering. Data gemmes lokalt i browseren. Lav jævnligt JSON-backup under Indstillinger.</p></div></section><section id="detail" class="hidden"><button class="btn secondary" onclick="go('home')">← Tilbage</button><h2 id="detailTitle"></h2><div id="detailBody"></div></section></main><nav><button onclick="go('home')"><b>⌂</b>Hjem</button><button onclick="show('stats')"><b>▥</b>Stats</button><button onclick="show('weapons')"><b>⌖</b>Våben</button><button onclick="show('camo')"><b>◈</b>Camos</button><button onclick="show('settings')"><b>⚙</b>Indstillinger</button></nav><script>
const STORAGE='warzonehub-v1';
const FEATURES=[['stats','▥','Your Stats'],['weapons','⌖','Weapon Stats'],['camo','◈','Camo Tracker'],['missions','⚑','Mission Tracker']];
const CATEGORIES=['Assault Rifle','SMG','LMG','Shotgun','Marksman Rifle','Sniper Rifle','Pistol','Melee','Other'];
const MODES=['Warzone','Multiplayer','DMZ'];
const KNOWN=['Cronen Osprey','CSG-35','M4','Kastov 762','Axion','ISO Nightshade','PPSh-41','VEL 46','WZ.55 Striga','Hyeon Burst','Han 86','Type 73'];
const BASE={level:1,matches:[],weapons:[],missions:[],loadouts:[],camos:[],dmz:[],settings:[],catalog:[],schemaVersion:2};
let data;try{data={...BASE,...JSON.parse(localStorage.getItem(STORAGE)||'{}')}}catch{data={...BASE}}
for(const k of ['matches','weapons','missions','loadouts','camos','dmz','settings','catalog'])if(!Array.isArray(data[k]))data[k]=[];
let current='home';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=x=>Number(x)||0, uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const percent=(a,b)=>b>0?Math.min(100,Math.round(100*num(a)/num(b))):0;
const progress=(a,b)=>`<div class="progress"><div style="width:${percent(a,b)}%"></div></div><small>${num(a)} / ${num(b)} · ${percent(a,b)}%</small>`;
const options=(items,sel='')=>items.map(x=>`<option value="${esc(x)}" ${x===sel?'selected':''}>${esc(x)}</option>`).join('');
const weaponName=id=>data.weapons.find(w=>String(w.id)===String(id))?.name||'Ukendt våben';
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(data));refresh();return true}catch(e){alert('Kunne ikke gemme lokalt. Eksportér en backup og kontrollér browserens lagerplads.');return false}}
function go(id){current=id;$('home').classList.toggle('hidden',id!=='home');$('detail').classList.toggle('hidden',id==='home');if(id!=='home'){let f=FEATURES.find(f=>f[0]===id);$('detailTitle').textContent=f?.[2]||({loadouts:'Loadouts',settings:'Indstillinger'}[id]||id);$('detailBody').innerHTML=render(id)}refresh();window.scrollTo(0,0)}
function show(id){go(id)}
function refresh(){ $('heroLevel').textContent=data.level;let kills=data.matches.reduce((s,x)=>s+num(x.kills),0),deaths=data.matches.reduce((s,x)=>s+num(x.deaths),0);$('quick').innerHTML=[['Våben',data.weapons.length],['Camos',data.camos.filter(x=>num(x.done)>=num(x.total)&&num(x.total)>0).length],['Missioner',data.missions.filter(x=>num(x.done)>=num(x.total)&&num(x.total)>0).length],['K/D',deaths?(kills/deaths).toFixed(2):'—']].map(([a,b])=>`<div class="card" style="text-align:center"><div class="stat">${b}</div><small>${a}</small></div>`).join('')}
$('tiles').innerHTML=[...FEATURES,['loadouts','▤','Loadouts'],['settings','⚙','Backup & indstillinger']].map(([id,ico,label])=>`<button class="tile" onclick="show('${id}')"><span class="ico">${ico}</span><span>${label}</span></button>`).join('');
function form(id,fields,btn='Gem'){return `<form class="card form" onsubmit="add(event,'${id}')">${fields.map(([name,label,type='text',placeholder=''])=>`<label>${label}<input name="${name}" type="${type}" placeholder="${esc(placeholder)}" ${name==='name'?'required':''}></label>`).join('')}<button class="btn">${btn}</button></form>`}
function add(e,id){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));x.id=uid();data[id].unshift(x);persist();go(({matches:'stats',weapons:'weapons',missions:'missions',loadouts:'loadouts',camos:'camo'})[id]||id)}
function removeEntry(collection,id,view){if(!confirm('Slet denne registrering?'))return;data[collection]=data[collection].filter(x=>String(x.id)!==String(id));persist();go(view)}
function render(id){
if(id==='stats'){let sums=k=>data.matches.reduce((a,x)=>a+num(x[k]),0);return `<div class="grid">${[['Kills',sums('kills')],['Deaths',sums('deaths')],['K/D',sums('deaths')?(sums('kills')/sums('deaths')).toFixed(2):'—'],['Wins',sums('wins')],['Damage',sums('damage')],['Kampe',data.matches.length]].map(([k,v])=>`<div class="card"><div class="stat">${v}</div><small>${k}</small></div>`).join('')}</div><h2>Registrer kamp</h2>${form('matches',[['mode','Spiltype'],['kills','Kills','number'],['deaths','Deaths','number'],['damage','Damage','number'],['wins','Wins (0 eller 1)','number']])}<h2>Kamphistorik</h2>${data.matches.map(x=>`<div class="card row"><div><b>${esc(x.mode)}</b><p class="mini">${num(x.kills)} kills · ${num(x.deaths)} deaths · ${num(x.damage)} damage</p></div><button class="delete" onclick="removeEntry('matches','${esc(x.id)}','stats')">✕</button></div>`).join('')||'<p class="muted">Ingen kampe endnu.</p>'}`}
if(id==='weapons')return `<p class="hint">Våbenlevels og attachments gemmes lokalt. Vælg selv våbennavn; ingen uverificerede balanceværdier er indlæst.</p><form class="card form" onsubmit="addWeapon(event)"><label>Våbennavn<input name="name" list="weaponSuggestions" required placeholder="Søg eller skriv våben"></label><datalist id="weaponSuggestions">${KNOWN.map(w=>`<option value="${esc(w)}">`).join('')}</datalist><div class="two"><label>Spil<select name="game">${options(MODES)}</select></label><label>Kategori<select name="category">${options(CATEGORIES)}</select></label></div><div class="two"><label>Nuværende level<input type="number" name="level" min="0" value="1" required></label><label>Max level (valgfri)<input type="number" name="max" min="1" placeholder="Ikke verificeret"></label></div><label>Attachments / noter<textarea name="build" placeholder="Dine oplåste attachments"></textarea></label><button class="btn">Tilføj våben</button></form><h2>Mine våben (${data.weapons.length})</h2>${data.weapons.map(w=>`<div class="card"><div class="row"><b>${esc(w.name)}</b><span class="badge">${esc(w.game||'Warzone')}</span></div><p class="mini">${esc(w.category||'Ukendt kategori')}</p>${num(w.max)>0?progress(w.level,w.max):`<p class="mini">Level ${num(w.level)} · max level ikke angivet</p>`}<div class="two"><label class="mini">Level<input aria-label="Level for ${esc(w.name)}" type="number" min="0" value="${num(w.level)}" id="wl-${esc(w.id)}" style="width:100%;padding:9px;background:#101719;color:white;border:1px solid #445;border-radius:9px"></label><label class="mini">Max level<input aria-label="Maks level for ${esc(w.name)}" type="number" min="1" value="${num(w.max)||''}" id="wm-${esc(w.id)}" style="width:100%;padding:9px;background:#101719;color:white;border:1px solid #445;border-radius:9px"></label></div><label class="mini">Attachments / noter<textarea id="wb-${esc(w.id)}" style="width:100%;padding:9px;background:#101719;color:white;border:1px solid #445;border-radius:9px">${esc(w.build)}</textarea></label><div class="actions"><button class="btn" onclick="updateWeapon('${esc(w.id)}')">Gem ændringer</button><button class="btn secondary" onclick="newCamoFor('${esc(w.id)}')">Camo</button><button class="delete" onclick="removeEntry('weapons','${esc(w.id)}','weapons')">Slet</button></div></div>`).join('')||'<p class="muted">Ingen våben endnu.</p>'}`;
if(id==='camo')return `<p class="ok">Camo-progression er knyttet til våben, når du vælger et våben fra listen. Ændringer i våbenniveauer vises på camo-kortene.</p><form class="card form" onsubmit="addCamo(event)"><label>Våben<select name="weaponId" required><option value="">Vælg våben</option>${data.weapons.map(w=>`<option value="${esc(w.id)}">${esc(w.name)} (${esc(w.game||'Warzone')})</option>`).join('')}</select></label><label>Camouflage / challenge<input name="name" required placeholder="Navn på camo"></label><div class="two"><label>Gennemført<input type="number" name="done" min="0" value="0"></label><label>Mål<input type="number" name="total" min="1" required></label></div><label>Oplåses ved level (valgfrit)<input type="number" name="unlockLevel" min="0"></label><button class="btn" ${!data.weapons.length?'disabled':''}>Tilføj camo</button></form>${!data.weapons.length?'<p class="warning">Tilføj først et våben under Weapon Stats.</p>':''}<h2>Camo progression</h2>${data.camos.map(c=>{let w=data.weapons.find(w=>String(w.id)===String(c.weaponId));let name=w?.name||c.name||'Ukendt';let unlock=num(c.unlockLevel);return `<div class="card"><div class="row"><b>${esc(c.name||name)}</b><span class="badge">${esc(w?.game||'Manuel')}</span></div><p class="mini">${esc(w?.name||'Ældre registrering')} · Weapon Level ${num(w?.level)}${unlock?' · Krævet level '+unlock:''}</p>${progress(c.done,c.total)}${unlock&&num(w?.level)<unlock?'<p class="mini">🔒 Krævet våbenniveau er endnu ikke nået.</p>':''}<div class="actions"><button class="btn secondary" onclick="adjust('camos','${esc(c.id)}',-1,'camo')">−1</button><button class="btn" onclick="adjust('camos','${esc(c.id)}',1,'camo')">+1</button><button class="delete" onclick="removeEntry('camos','${esc(c.id)}','camo')">Slet</button></div></div>`}).join('')||'<p class="muted">Ingen camo-challenges endnu.</p>'}`;
if(id==='missions')return `<p class="hint">Warzone, Multiplayer og DMZ holdes adskilt. Kun bekræftede krav bør indtastes som officielle.</p><form class="card form" onsubmit="addMission(event)"><label>Mission / challenge<input name="name" required></label><label>Spil<select name="game">${options(MODES)}</select></label><div class="two"><label>Progression<input name="done" type="number" min="0" value="0"></label><label>Mål<input name="total" type="number" min="1" required></label></div><label>Noter<input name="note"></label><button class="btn">Tilføj mission</button></form><h2>Mine missioner</h2>${data.missions.map(m=>`<div class="card"><div class="row"><b>${esc(m.name)}</b><span class="badge">${esc(m.game||'Ikke angivet')}</span></div><p class="mini">${esc(m.note)}</p>${progress(m.done,m.total)}<div class="actions"><button class="btn secondary" onclick="adjust('missions','${esc(m.id)}',-1,'missions')">−1</button><button class="btn" onclick="adjust('missions','${esc(m.id)}',1,'missions')">+1</button><button class="delete" onclick="removeEntry('missions','${esc(m.id)}','missions')">Slet</button></div></div>`).join('')||'<p class="muted">Ingen missioner endnu.</p>'}`;
if(id==='loadouts')return `<p class="hint">Loadouts gemmes som dine egne builds. Attachment-navne verificeres ikke automatisk.</p><form class="card form" onsubmit="addLoadout(event)"><label>Navn<input name="name" required></label><label>Spil<select name="game">${options(MODES)}</select></label><label>Primært våben<select name="weaponId"><option value="">Manuelt / ikke valgt</option>${data.weapons.map(w=>`<option value="${esc(w.id)}">${esc(w.name)}</option>`).join('')}</select></label><label>Sekundært våben<input name="secondary"></label><label>Attachments<textarea name="attachments"></textarea></label><label>Perks / udstyr<input name="perks"></label><button class="btn">Gem loadout</button></form><h2>Mine builds</h2>${data.loadouts.map(l=>`<div class="card"><div class="row"><b>${esc(l.name)}</b><span class="badge">${esc(l.game||'Warzone')}</span></div><p>${esc(l.weaponId?weaponName(l.weaponId):l.primary||'Intet våben valgt')} + ${esc(l.secondary||'—')}</p><p class="mini">${esc(l.attachments||'Ingen attachments')} · ${esc(l.perks||'Ingen perks')}</p><button class="delete" onclick="removeEntry('loadouts','${esc(l.id)}','loadouts')">Slet</button></div>`).join('')||'<p class="muted">Ingen loadouts endnu.</p>'}`;
if(id==='settings')return `<div class="card form"><label>Player Level<input id="level" type="number" min="1" value="${num(data.level)||1}"></label><button class="btn" onclick="data.level=Math.max(1,num($('level').value));persist();go('settings')">Gem level</button></div><h2>💾 Backup og gendannelse</h2><div class="card"><p class="warning">Eksportér altid en backup før du erstatter HTML-filen eller rydder browserdata. Lokale data følger ikke automatisk med til en anden browser eller filadresse.</p><div class="actions"><button class="btn" onclick="exportData()">Eksportér JSON-backup</button></div><p class="mini">Import erstatter dine lokale data efter bekræftelse. Eksportér først din nuværende backup.</p><label>Importér backup<input type="file" accept=".json,application/json" onchange="importData(event)"></label></div><h2>Om data</h2><div class="card"><p class="mini">Ingen automatisk Activision/PSN-synkronisering. Kildeoplysninger fra patch notes indlæses ikke automatisk. Kun manuelt registrerede oplysninger er tilgængelige. Gemte data: ${data.weapons.length} våben, ${data.camos.length} camos, ${data.missions.length} missioner, ${data.loadouts.length} loadouts.</p></div>`;
return ''}
function addWeapon(e){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));x.id=uid();x.level=Math.max(0,num(x.level));x.max=Math.max(0,num(x.max));data.weapons.unshift(x);persist();go('weapons')}
function updateWeapon(id){let w=data.weapons.find(x=>String(x.id)===String(id));if(!w)return;w.level=Math.max(0,num($('wl-'+id).value));w.max=Math.max(0,num($('wm-'+id).value));w.build=$('wb-'+id).value;persist();go('weapons')}
function newCamoFor(id){go('camo');let el=$('detailBody').querySelector('select[name="weaponId"]');if(el)el.value=id}
function addCamo(e){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));x.id=uid();x.done=Math.max(0,num(x.done));x.total=Math.max(1,num(x.total));data.camos.unshift(x);persist();go('camo')}
function addMission(e){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));x.id=uid();x.done=Math.max(0,num(x.done));x.total=Math.max(1,num(x.total));data.missions.unshift(x);persist();go('missions')}
function addLoadout(e){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));x.id=uid();data.loadouts.unshift(x);persist();go('loadouts')}
function adjust(group,id,delta,view){let x=data[group].find(x=>String(x.id)===String(id));if(!x)return;x.done=Math.max(0,Math.min(num(x.total)||Infinity,num(x.done)+delta));persist();go(view)}
function exportData(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=u;a.download='warzone-hub-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
async function importData(e){try{let f=e.target.files?.[0];if(!f)return;let d=JSON.parse(await f.text());if(!d||typeof d!=='object'||!Array.isArray(d.matches)||!Array.isArray(d.weapons)||!Array.isArray(d.camos)||!Array.isArray(d.missions))throw Error('Forkert filformat');if(!confirm('Dette ERSTATTER dine nuværende lokale data. Har du eksporteret en backup?'))return;data={...BASE,...d};for(let k of ['matches','weapons','missions','loadouts','camos','dmz','settings','catalog'])if(!Array.isArray(data[k]))data[k]=[];persist();go('settings');alert('Backup indlæst.')}catch(err){alert('Backup kunne ikke indlæses: '+err.message)}finally{e.target.value=''}}
refresh();

</script></body></html>
